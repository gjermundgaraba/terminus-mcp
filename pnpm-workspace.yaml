allowBuilds:
  esbuild: true
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
catalog:
  "@clanker-stuff/oxlint-config": 0.5.0
  "@effect/platform-node": 4.1.2
  "@effect/tsgo": 0.67.1
  "@effect/vitest": 4.1.2
  "@gjermundgaraba/effect-actions": 0.29.0
  effect: 4.1.2
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plus: 1.5.0
  vitest: 5.1.0
  ultracite: 8.1.1
catalogMode: prefer
saveExact: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@clanker-stuff/*"
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
  - "@gjermundgaraba/*"
  - "@gjermundgaraba-designs/*"
  - effect
  - "@effect/*"
permissions:
  ultracite:
    skills: true
# Name the directories pnpm links Ultracite's skill into: without one it auto-detects an agent,
# and where none is installed, as in the Docker build, the install fails.
skills:
  dirs:
    - .agents/skills
    - .claude/skills

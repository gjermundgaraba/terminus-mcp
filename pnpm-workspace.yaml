allowBuilds:
  esbuild: true
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
catalog:
  "@effect/platform-node": 4.0.6
  "@effect/platform-node-shared": 4.0.6
  "@effect/tsgo": 0.57.0
  "@effect/vitest": 4.0.6
  "@gjermundgaraba/effect-actions": 0.20.0
  effect: 4.0.6
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  vitest: 5.0.5
  ultracite: 8.0.2
  oxlint: 1.89.0
  oxfmt: 0.74.0
catalogMode: prefer
saveExact: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
  - "@gjermundgaraba/*"
  - "@gjermundgaraba-designs/*"
  - effect
  - "@effect/*"
permissions:
  ultracite:
    skills: true
# Name the directories pnpm links Ultracite's skill into: without one it auto-detects an agent,
# and where none is installed, as in the Docker build, the install fails.
skills:
  dirs:
    - .agents/skills
    - .claude/skills
